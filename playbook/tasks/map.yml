---

- name: "Set variables for {{ item.map }}"
  ansible.builtin.set_fact:
    name: "{{ item.name | default(item.map) | regex_replace('_(WP|wp)', '') }}"
    map: "{{ item.name | default(item.map) | regex_replace('_(WP|wp)', '') | regex_replace('([A-Z])', '_\\1') | regex_replace('^_', '') | lower }}"

- name: "More variables {{ item.map }}"
  ansible.builtin.set_fact:
    map_dir: "{{ asa_config_dir }}/{{ map }}"
    map_config_dir: "{{ asa_config_dir }}/{{ map }}/Saved/Config/WindowsServer"

- name: "Copy environment file {{ map }}.env"
  ansible.builtin.template:
    src: map.env
    dest: "{{ map_dir }}/{{ map }}.env"
  notify: Restart Pod

- name: "Create ARK Config directory {{ name }}"
  ansible.builtin.file:
    path: "{{ map_config_dir }}"
    state: directory

- name: "Create ini files for {{ name }}"
  ansible.builtin.copy:
    dest: "{{ map_config_dir }}/{{ ini_item.key }}"
    content: "{{ ini_item.value }}"
  loop: "{{ asa_ini_files | dict2items }}"
  loop_control:
    loop_var: ini_item
    
- name: arkserver container {{ name }}
  containers.podman.podman_container:
    name: "{{ map }}"
    image: localhost/kafka/arkserver
    state: quadlet
    quadlet_options: |
      [Unit]
      Description=Ark ASA Server Map {{ name }}
      After=steamcmd.service
      Wants=steamcmd.service
    detach: true
    env_file:
      - "%h/{{ asa_config_path }}/image.env"
      - "%h/{{ asa_config_path }}/maps.env"
      - "%h/{{ asa_config_path }}/{{ map }}/{{ map }}.env"
    volumes:
      - server_data:/opt/arkserver:z
      - "%h/{{ asa_config_path }}/{{ map }}/Saved:/opt/arkserver/ShooterGame/Saved"
      - "%h/ark_backup:/var/backups/arkserver"
    sdnotify: container
    pod: asa.pod
  notify: Restart Pod
