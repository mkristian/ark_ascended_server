---
- name: Ensure config directory eists
  ansible.builtin.file:
    path: "{{ asa_config_dir }}"
    state: directory

- name: Copy shared environment
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ asa_config_dir }}"
  loop:
    - image.env
    - steamcmd.env
    - maps.env
  notify: Restart Pod
